# This is a basic workflow to help you get started with Actions
name: Release

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: ["master"]

env:
  PARALLELISM: 3

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "release"
  release:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      # Commit the version and changelog, tag, and create the release
      contents: write
      # Push the image to ghcr.io
      packages: write
      # Sign the image's build provenance attestation
      id-token: write
      attestations: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Go Report Card
        uses: creekorful/goreportcard-action@v1.0

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          # Fetch all versions for tag/changelog generation
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.8

      - name: Install promu
        id: make_promu
        run: |
          make promu

      - name: Calculate Version
        id: calculate_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Update Version
        id: update_version
        env:
          NEW_VERSION: ${{ steps.calculate_version.outputs.new_version }}
        run: |
          echo "${NEW_VERSION}" > VERSION

      - name: Update Changelog
        id: update_changelog
        env:
          CHANGELOG: ${{ steps.calculate_version.outputs.changelog }}
        run: |
          mv CHANGELOG.md _CHANGELOG.md || touch _CHANGELOG.md
          echo "${CHANGELOG}" > CHANGELOG.md
          cat _CHANGELOG.md >> CHANGELOG.md
          rm -f _CHANGELOG.md

      - name: Commit Changes
        id: commit_changes
        uses: EndBug/add-and-commit@v11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          add: VERSION CHANGELOG.md
          message: |
            chore(build): Releasing ${{ steps.calculate_version.outputs.new_tag }}

      - name: Commit Tag
        id: commit_tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_sha: ${{ steps.commit_changes.outputs.commit_long_sha }}

      - name: Build
        id: build
        run: |
          promu crossbuild --parallelism "$PARALLELISM"
          promu crossbuild --parallelism "$PARALLELISM" tarballs
          promu checksum .tarballs

      # actions/create-release is archived; its README lists this as a replacement.
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.calculate_version.outputs.new_tag }}
          name: Release ${{ steps.calculate_version.outputs.new_tag }}
          body: |
            Changes in this release:
            ${{ steps.calculate_version.outputs.changelog }}
          files: .tarballs/*
          fail_on_unmatched_files: true

      # The image copies the linux binaries the crossbuild above produced, so
      # it carries the same build as the tarballs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.calculate_version.outputs.new_tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.calculate_version.outputs.new_tag }}
            type=semver,pattern=v{{major}},value=${{ steps.calculate_version.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push image
        id: image_push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          annotations: ${{ steps.image_meta.outputs.annotations }}
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image_push.outputs.digest }}
          push-to-registry: true
